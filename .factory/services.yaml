commands:
  install_backend: C:\Users\shivo\Projects\luma-agent\venv\Scripts\python.exe -m pip install -r C:\Users\shivo\Projects\luma-agent\requirements.txt
  install_frontend: cd C:\Users\shivo\Projects\luma-agent\frontend; npm install
  install_playwright: C:\Users\shivo\Projects\luma-agent\venv\Scripts\python.exe -m playwright install chromium
  test: C:\Users\shivo\Projects\luma-agent\venv\Scripts\python.exe -m pytest C:\Users\shivo\Projects\luma-agent -v --tb=short -x
  lint: cd C:\Users\shivo\Projects\luma-agent\frontend; npm run lint
  typecheck: cd C:\Users\shivo\Projects\luma-agent\frontend; npx tsc --noEmit

services:
  backend:
    start: Start-Process -NoNewWindow -FilePath "C:\Users\shivo\Projects\luma-agent\venv\Scripts\python.exe" -ArgumentList "-m","uvicorn","main:app","--port","8000","--reload" -WorkingDirectory "C:\Users\shivo\Projects\luma-agent"
    stop: Get-Process -Id (Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue).OwningProcess -ErrorAction SilentlyContinue | Stop-Process -Force
    healthcheck: curl -sf http://localhost:8000/health
    port: 8000
    depends_on: []

  frontend:
    start: Start-Process -NoNewWindow -FilePath "npm" -ArgumentList "run","dev" -WorkingDirectory "C:\Users\shivo\Projects\luma-agent\frontend"
    stop: Get-Process -Id (Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue).OwningProcess -ErrorAction SilentlyContinue | Stop-Process -Force
    healthcheck: curl -sf http://localhost:3000
    port: 3000
    depends_on: [backend]
